<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pranam</title>
    <link rel="stylesheet" href="./assets/plugins/swiper/swiper-bundle.min.css">
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="stylesheet" href="./assets/css/common.css">
    <link rel="stylesheet" href="./assets/css/pranam.css">
</head>

<body id="body">

    <div id="langSelect">
        <div id="language">
            <label><input type="radio" onclick="val('English')" name="lang" id="en" value="English">
                <span>E</span>
            </label>
            <label><input type="radio" onclick="val('Hindi')" name="lang" id="hi" value="Hindi">
                <span>H</span>
            </label>
            <label><input type="radio" onclick="val('Gujrati')" name="lang" id="gu" value="Gujrati">
                <span>G</span>
            </label>
        </div>
    </div>

    <img class="page-bg" src="./assets/images/background.jpg" alt="">

    <div class="main-container">
        <div class="stage">
            <img class="stage-spacer" src="./assets/images/stage-spacer.png" alt="">
            <div class="frame-border"></div>
            <a class="back-button" href="virtues.html"><img src="./assets/images/who-back.png" alt="Back to Virtues of a Friend"></a>
            <div class="stage-item pranam-card"><img src="./assets/images/pranam-card.png" alt="Decorative purple card"></div>
            <div class="stage-item pranam-disc"></div>
            <div class="stage-item pranam-ring"></div>
            <div class="stage-item pranam-video">
                <img class="pranam-video-sizer" src="./assets/images/pranam-video-sizer.png" alt="">
                <video src="./assets/videos/pranam.mp4" preload="auto" autoplay muted loop playsinline></video>
            </div>
            <h1 class="stage-item pranam-title" data-text="pranam.title"></h1>
            <a class="stage-item home-pill" href="index.html">
                <img src="./assets/images/pranam-home.png" alt="Home">
                <span class="home-pill-label" data-text="pranam.home"></span>
            </a>
        </div>
    </div>

    <script src="./assets/plugins/swiper/swiper-bundle.min.js"></script>
    <script src="./assets/js/jquery-3.7.1.js"></script>
    <script src="./assets/js/data.js"></script>
    <script src="./assets/js/custom.js"></script>
    <script src="./assets/js/pranam.js"></script>
</body>

</html>
